ht="600" font-family="inherit">2,380, 57% of previous</text><text data-ts-key="label-values:object:null:number:1464" fill="#fafcff" x="166.79" y="184.82" text-anchor="start" dominant-baseline="middle" font-size="12" font-weight="600" font-family="inherit">1,464, 62% of previous</text></g></g><g data-ts-key="axes" class="ts-chart__axes" aria-hidden="true"><text data-ts-key="y-tick-label:string:12:Viewed event" fill="#a6b6c5" fill-opacity="0.68" x="124" y="35.18" text-anchor="end" dominant-baseline="middle" font-size="12" font-family="inherit">Viewed event</text><text data-ts-key="y-tick-label:string:13:Chose tickets" fill="#a6b6c5" fill-opacity="0.68" x="124" y="85.06" text-anchor="end" dominant-baseline="middle" font-size="12" font-family="inherit">Chose tickets</text><text data-ts-key="y-tick-label:string:16:Started checkout" fill="#a6b6c5" fill-opacity="0.68" x="124" y="134.94" text-anchor="end" dominant-baseline="middle" font-size="12" font-family="inherit">Started checkout</text><text data-ts-key="y-tick-label:string:4:Paid" fill="#a6b6c5" fill-opacity="0.68" x="124" y="184.82" text-anchor="end" dominant-baseline="middle" font-size="12" font-family="inherit">Paid</text></g></svg>