<svg xmlns="http://www.w3.org/2000/svg" class="ts-chart" width="640" height="220" viewBox="0 0 640 220" role="img" aria-roledescription="chart" aria-label="Julia Jacklin and Genesis Owusu are behind on pace and sales" style="font-family:Intermission,system-ui,sans-serif;font-size:12px;font-variant-numeric:tabular-nums;color:#a6b6c5;background:#161a1e;display:block;overflow:visible"><style>[data-ts-key^="label-"]{paint-order:stroke;stroke:#161a1e;stroke-width:3px;stroke-linejoin:round}</style><rect x="0" y="0" width="640" height="220" fill="#161a1e"/><g data-ts-key="grid" class="ts-chart__grid" aria-hidden="true" stroke="#28323c" stroke-opacity="0.11" stroke-width="1"><line data-ts-key="y-grid:number:0.2" stroke="#28323c" stroke-opacity="1" x1="32.24" y1="200" x2="632" y2="200"/><line data-ts-key="y-grid:number:0.5" stroke="#28323c" stroke-opacity="1" x1="32.24" y1="105" x2="632" y2="105"/><line data-ts-key="y-grid:number:0.8" stroke="#28323c" stroke-opacity="1" x1="32.24" y1="10" x2="632" y2="10"/></g><g data-ts-key="marks" class="ts-chart__marks"><g data-ts-key="quadrant-x" class="ts-chart__rule ts-chart__rule-x" aria-hidden="true"><line data-ts-key="quadrant-x:number:100:0" stroke="#3a4957" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 3" x1="332.12" y1="10" x2="332.12" y2="200"/></g><g data-ts-key="quadrant-y" class="ts-chart__rule ts-chart__rule-y" aria-hidden="true"><line data-ts-key="quadrant-y:number:0.5:0" stroke="#3a4957" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 3" x1="32.24" y1="105" x2="632" y2="105"/></g><g data-ts-key="label-quadrants" class="ts-chart__text" aria-hidden="true"><text data-ts-key="label-quadrants:object:null:string:26:[&quot;number:60&quot;,&quot;number:0.8&quot;]" fill="#a6b6c5" x="32.24" y="18" text-anchor="start" dominant-baseline="middle" font-size="12" font-family="inherit">Sold, slowing</text><text data-ts-key="label-quadrants:object:null:string:27:[&quot;number:140&quot;,&quot;number:0.8&quot;]" fill="#