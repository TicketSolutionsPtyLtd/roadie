packages:
  - 'packages/*'
  - 'docs'

# pnpm settings (migrated from .npmrc — pnpm 11's home for these is here).
nodeLinker: isolated
enablePrePostScripts: true
engineStrict: true
preferWorkspacePackages: true
saveExact: true

# Supply-chain cooldown (pnpm 11): refuse package versions published less than
# 3 days ago — value is in MINUTES (4320 = 3 days) — so a freshly-compromised
# release or typosquat can't be pulled in before it's noticed. Workspace
# @oztix/* packages are linked, not fetched, so the exclude is belt-and-braces
# for any that ever ship from the registry.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@oztix/*'
  # Security-only exemptions. Each entry MUST pin the exact version that
  # carries the fix, never a bare name or glob — a bare name would let the
  # next routine bump of that package skip the cooldown too. Drop entries
  # once the version ages past the cutoff; a stale one is a silent hole.
  #
  # Next 16.3.3 — unauthenticated RCE, GHSA-p293-qw3h-jr36 and
  # GHSA-2xp9-vwfh-vxw4. Cooldown lapses 2026-08-28.
  - 'next@16.3.3'
  - 'eslint-config-next@16.3.3'
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'

# Shared by CI and local runs. Gates on everything: accepted advisories go in
# `ignore` as GHSA ids with a reason, never by raising the threshold.
audit:
  level: low
  ignore: []

# Dependency postinstall/build scripts — left disabled (pnpm 10 ignored these
# too; the build + tests pass without them). Flip to true only if one is needed.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false

# Advisories natural resolution won't reach. Selectors are scoped to the line
# they patch. To find dead entries: drop this block, rm pnpm-lock.yaml,
# pnpm install --lockfile-only, pnpm audit — what's flagged is what's needed.
#
# Both are blocked upstream, not by us: postcss 8.5.4 comes from
# @tailwindcss/language-service, esbuild 0.27.7 from tsx.
overrides:
  esbuild@0.27: ^0.28.1
  # <=8.5.22 is still flagged, so this floor sits above the whole advisory
  # range rather than at the oldest version that clears the first one.
  postcss@8: ^8.5.23
