packages:
  - 'packages/*'
  - 'docs'

# pnpm settings (migrated from .npmrc — pnpm 11's home for these is here).
nodeLinker: isolated
enablePrePostScripts: true
engineStrict: true
preferWorkspacePackages: true
saveExact: true

# Supply-chain cooldown (pnpm 11): refuse package versions published less than
# 3 days ago — value is in MINUTES (4320 = 3 days) — so a freshly-compromised
# release or typosquat can't be pulled in before it's noticed. Workspace
# @oztix/* packages are linked, not fetched, so the exclude is belt-and-braces
# for any that ever ship from the registry.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@oztix/*'

# Shared by CI and local runs. Gates on everything: accepted advisories go in
# `ignore` as GHSA ids with a reason, never by raising the threshold.
audit:
  level: low
  ignore: []

# Dependency postinstall/build scripts — left disabled (pnpm 10 ignored these
# too; the build + tests pass without them). Flip to true only if one is needed.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false

# Advisories natural resolution won't reach. Selectors are scoped to the line
# they patch. To find dead entries: drop this block, rm pnpm-lock.yaml,
# pnpm install --lockfile-only, pnpm audit — what's flagged is what's needed.
#
# All are blocked upstream, not by us: next pins postcss 8.4.31 exactly and
# declares sharp ^0.34.5; esbuild 0.27.7 comes from tsx and @size-limit;
# js-yaml and nanoid arrive under toolchain deps that haven't re-released.
overrides:
  # 5.x only (>=4.0.0 <5.0.9); the 1.x/2.x lines are unaffected.
  brace-expansion@5: ^5.0.9
  esbuild@0.27: ^0.28.1
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  nanoid@3: ^3.3.18
  nanoid@5: ^5.1.16
  postcss@8: ^8.5.18
  sharp@0.34: ^0.35.3
