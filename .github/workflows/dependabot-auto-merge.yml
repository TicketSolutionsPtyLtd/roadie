name: Dependabot auto-merge

# Turns on auto-merge for the groups that never ship to consumers, so they land
# once `CI result` passes. Production bumps stay manual: they need a changeset.
# A merge made with GITHUB_TOKEN starts no push workflows on main; the next
# human merge, or the daily audit, picks those up.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: contains(fromJSON('["dev-minor-patch", "actions"]'), steps.metadata.outputs.dependency-group)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
