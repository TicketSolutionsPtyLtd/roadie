name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - 'packages/**'
  # Lets the release path be exercised without a qualifying push. With no
  # pending changesets and every package version already on npm, a manual run
  # is a no-op: the version job finds nothing and Publish is skipped.
  workflow_dispatch:

jobs:
  # Opens or updates the version PR. It has no environment and no id-token, so
  # nothing it runs can mint an npm publish token.
  version:
    name: Version
    runs-on: ubuntu-latest
    # Per job, not per workflow: a Publish waiting on its approval holds its
    # group, and a workflow-wide group would queue every later run behind it.
    concurrency: ${{ github.workflow }}-version-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      unpublished: ${{ steps.unpublished.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/composite-actions/setup

      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Also copies the roadie-skills version into the plugin manifest.
          version-script: pnpm changeset:version
          pr-title: 'chore: version packages'
          # Bot-pushed runs wait for approval; main still runs CI on merge,
          # since the squash commit takes the PR title and body. The ci-status
          # job gives the PR its required check instead.
          commit-message: 'chore: version packages [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same check `changeset publish` makes: a public package whose
      # version isn't on npm yet. Usually only true after the version PR merges.
      - name: Count unpublished versions
        id: unpublished
        # Not a process substitution: its exit status is ignored, so a failed
        # `pnpm ls` would read as zero unpublished and skip the release. Only a
        # 404 means unpublished; any other npm error fails the run rather than
        # asking for a release approval that publishes nothing.
        run: |
          packages=$(pnpm -r ls --depth -1 --json |
            jq -r '.[] | select(.private != true) | "\(.name)@\(.version)"')
          count=0
          errors="$RUNNER_TEMP/npm-view.log"
          for spec in $packages; do
            if found=$(npm view "$spec" version 2>"$errors"); then
              [ -n "$found" ] && continue
            elif ! grep -q E404 "$errors"; then
              cat "$errors" >&2
              exit 1
            fi
            echo "Unpublished: $spec"
            count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"

  # The version PR runs no CI, so this gives it main's "CI result", pending
  # until main's CI finishes; Release CI status updates it then.
  ci-status:
    name: CI status
    needs: version
    if: needs.version.outputs.has-changesets == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/release-ci-status.yml

  # npm's trusted publisher for every published package is pinned to this environment.
  # GitHub only puts an `environment` claim in the OIDC token when the job
  # declares one, and npm rejects the token without it.
  publish:
    name: Publish
    needs: version
    # Pending changesets mean the version PR hasn't merged; a brand-new package
    # counts as unpublished before then, and this job would try to version it.
    if: >-
      needs.version.outputs.has-changesets == 'false' &&
      needs.version.outputs.unpublished != '0'
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-publish-${{ github.ref }}
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/composite-actions/setup

      - name: Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
        env:
          # No NODE_AUTH_TOKEN: publishing authenticates through OIDC, so the
          # secret is dead weight. Provenance is automatic under trusted
          # publishing, so that flag is redundant too.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
