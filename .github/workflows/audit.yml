name: Audit

# Scheduled as well as per-PR: advisories are published upstream, so they land
# with no matching diff. Threshold lives in pnpm-workspace.yaml under `audit:`.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Monday 06:00 Brisbane
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Deliberately not the composite setup: audit reads pnpm-lock.yaml and
      # needs no node_modules, so installing would cost a minute and run
      # dependency lifecycle scripts inside the job that checks them.
      - name: Audit dependencies
        run: pnpm audit
