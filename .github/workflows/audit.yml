name: Audit

# Advisories land upstream with no matching diff, so a daily run on main
# catches them and PRs only run when they change dependencies. A failed
# scheduled run emails whoever last changed the cron line. Threshold lives in
# pnpm-workspace.yaml under `audit:`.
on:
  push:
    branches:
      - main
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/audit.yml'
  schedule:
    # Daily 06:00 Brisbane
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Deliberately not the composite setup: audit reads pnpm-lock.yaml and
      # needs no node_modules, so installing would cost a minute and run
      # dependency lifecycle scripts inside the job that checks them.
      - name: Audit dependencies
        shell: bash
        run: |
          status=0
          pnpm audit > audit.txt 2>&1 || status=$?
          cat audit.txt
          {
            echo '## pnpm audit'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
