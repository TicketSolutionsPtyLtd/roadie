name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # ready_for_review starts the full run a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Daily 03:00 Brisbane, clear of audit.yml's 20:00 UTC run
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The nightly run gets its own group so a push to main can't replace it while
# it waits. Drafts get their own too, so a late draft event can't cancel the
# full run ready_for_review started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Turbo steps pass no `--` args, which would change the hash of every task in
# the run and miss the cache. Each job restores and saves its own Turbo cache
# (composite-actions/setup and turbo-cache-save).
env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_FORCE: false

jobs:
  # Gates the other jobs with if: rather than workflow paths filters, so each
  # still reports a status when skipped. Outside a PR every output is true.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.classify.outputs.packages }}
      docs: ${{ steps.classify.outputs.docs }}
      browsers: ${{ steps.browsers.outputs.browsers }}
    steps:
      # PRs run Chromium alone unless labelled full-browsers. The label is
      # read live, not from the event payload, because a re-run reuses the
      # original payload and would miss a label added since.
      - name: Pick browsers
        id: browsers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          browsers='[{"browser":"chromium"},{"browser":"webkit","shard":"1/2"},{"browser":"webkit","shard":"2/2"},{"browser":"firefox","shard":"1/3"},{"browser":"firefox","shard":"2/3"},{"browser":"firefox","shard":"3/3"}]'
          if [[ -n $PR ]]; then
            labelled=$(gh api "repos/$REPO/pulls/$PR" --jq 'any(.labels[]; .name == "full-browsers")')
            if [[ $labelled != true ]]; then browsers='[{"browser":"chromium"}]'; fi
          fi
          echo "Browsers: $browsers"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # turbo ls reads the workspace without an install. The --no-renames path
      # checks count a file moved out of a package whatever turbo's diff does,
      # and a CI change, which affects no package, still tests itself.
      - name: Classify changes
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TURBO_SCM_BASE: HEAD^1
        run: |
          if [[ $EVENT != pull_request ]]; then
            printf '%s\n' packages=true docs=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          turbo="turbo@$(jq -r .devDependencies.turbo package.json)"
          affected=$(npx --yes "$turbo" ls --affected --output=json | jq -c '[.packages.items[].name]')
          # roadie-skills is markdown with no build or tests, so it starts nothing.
          packages=$(jq 'any(. != "docs" and . != "roadie-skills")' <<< "$affected")
          docs=$(jq 'index("docs") != null' <<< "$affected")
          if grep -q '^packages/' <<< "$files"; then packages=true; fi
          if grep -q '^docs/' <<< "$files"; then docs=true; fi
          if grep -qE '^(\.github/|vitest\.browsers\.config\.ts$)' <<< "$files"; then
            packages=true
            docs=true
          fi
          echo "Affected packages: $affected. Packages: $packages. Docs: $docs."
          printf '%s\n' "packages=$packages" "docs=$docs" >> "$GITHUB_OUTPUT"

  # On a schedule --affected compares main with itself and finds nothing.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A change to turbo.json or the lockfile tests every package, which runs
    # about 10 minutes one package at a time.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # On a push main is HEAD, so a depth-1 fetch would make HEAD shallow and
      # drop the HEAD^1 that TURBO_SCM_BASE compares with.
      - name: Fetch base branch
        if: github.event_name != 'push'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Setup
        uses: ./.github/composite-actions/setup

      - name: Check component docs
        run: node scripts/check-component-docs.mjs

      - name: Check docs content
        run: node scripts/check-docs-content.mjs

      # Root scripts belong to no turbo package, so turbo test skips them.
      - name: Test repo scripts
        run: node --test 'scripts/**/*.test.mjs'

      # Warning only. On a pull_request the checkout is a merge commit whose
      # first parent is the base, so HEAD^1 diffs just this PR without a full
      # clone, even if main moves after the merge ref is built. Anything but an
      # OK line (oversized, skipped, or a crash) becomes the warning, with
      # newlines escaped so a stack trace isn't cut to its first line.
      - name: Check PR size
        if: github.event_name == 'pull_request'
        run: |
          status=0
          report=$(node scripts/check-pr-size.mjs --base HEAD^1 2>&1) || status=$?
          echo "$report"
          if ((status != 0)) || [[ $report != "PR size OK:"* || $report == *$'\n'* ]]; then
            report=${report//'%'/%25}
            report=${report//$'\r'/%0D}
            report=${report//$'\n'/%0A}
            echo "::warning title=PR size::$report"
          fi

      # HEAD^1 is the base for the same reason as the size check.
      - name: Check plugin release
        if: github.event_name == 'pull_request'
        run: node scripts/check-plugin-release.mjs --base HEAD^1

      # Warning only, on the changesets this PR adds, edits, or renames: wording
      # that keeps a new component or package off the changelog's highlight
      # cards. HEAD^1 is the base for the same reason as the size check.
      - name: Check changesets
        if: github.event_name == 'pull_request'
        run: |
          node docs/scripts/check-changesets.ts --base HEAD^1 ||
            echo "::warning title=Changelog card::The changeset check failed to run."

      - name: Lint and typecheck
        run: pnpm turbo lint typecheck --affected
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'push' && 'HEAD^1' || 'origin/main' }}

      # On 4 vCPUs, jsdom suites run 8 to 20 times slower beside lint,
      # typecheck and other packages' tests, so tests run one package at a time.
      - name: Test
        run: pnpm turbo test --affected --concurrency=1
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'push' && 'HEAD^1' || 'origin/main' }}

      # Lint doesn't check formatting, so this is the only check that does.
      - name: Check formatting
        run: pnpm format:check

      - name: Save Turbo cache
        if: ${{ !cancelled() }}
        uses: ./.github/composite-actions/turbo-cache-save

  # Drafts run only check; marking one ready runs the rest. Only packages
  # have browser tests, and the nightly quarantine run isn't a PR.
  playwright:
    name: playwright version
    needs: changes
    if: >-
      github.event.pull_request.draft != true &&
      (needs.changes.outputs.packages == 'true' ||
      github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout package.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Read Playwright version
        id: version
        run: echo "version=$(jq -r .devDependencies.playwright package.json)" >> "$GITHUB_OUTPUT"

  browser:
    name: browser (${{ matrix.browser }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: [changes, playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # The image ships the browsers and their system libraries. Installing them
    # from apt stalled on slow mirrors and timed jobs out.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001 --ipc=host
    # One engine per runner: three at once backlog Vitest's Playwright bridge
    # and actions time out (vitest-dev/vitest#9941). Firefox runs files one at
    # a time, so it is split across three runners: on two, each shard of the
    # components suite ran four to six minutes and the job neared its limit.
    # WebKit is split across two, since on one it ran past 11 minutes, the
    # slowest job in the run.
    # The changes job picks the engines, so the check names stay the same
    # whichever engines run.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.browsers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # On a push main is HEAD, so a depth-1 fetch would make HEAD shallow and
      # drop the HEAD^1 that TURBO_SCM_BASE compares with.
      - name: Fetch base branch
        if: github.event_name != 'push'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Setup
        uses: ./.github/composite-actions/setup
        with:
          cache-scope: browser-${{ matrix.browser }}-${{ strategy.job-index }}

      - name: Browser tests
        # One package at a time: concurrent suites fight for the runner's CPU
        # and push layout-heavy tests past their timeout. Nightly and manual
        # runs test every package, since main compared with itself has none.
        run: >-
          pnpm turbo test:browser
          ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '--affected' || '' }}
          --concurrency=1
        env:
          ROADIE_BROWSERS: ${{ matrix.browser }}
          ROADIE_QUARANTINE: skip
          # By env, since `--` args change the hash of every task in the run.
          ROADIE_SHARD: ${{ matrix.shard }}
          TURBO_SCM_BASE: ${{ github.event_name == 'push' && 'HEAD^1' || 'origin/main' }}

      # Only Chromium takes screenshots. The log names the -actual and -diff
      # images, but they live on the runner.
      - name: Upload screenshot diffs
        if: failure() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: packages/components/.vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Turbo cache
        if: ${{ !cancelled() }}
        uses: ./.github/composite-actions/turbo-cache-save

  browser-quarantine:
    name: browser (quarantined)
    needs: playwright
    # Known flakes need no per-PR run. Without --affected the nightly run
    # covers every package, since main compared with itself has none.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/composite-actions/setup

      # Known flakes listed in vitest.browsers.config.ts, without retries.
      # Failures show as annotations but never block a merge.
      - name: Quarantined browser tests
        continue-on-error: true
        run: pnpm turbo test:browser --concurrency=1
        env:
          ROADIE_BROWSERS: chromium,webkit,firefox
          ROADIE_QUARANTINE: only

      - name: Save Turbo cache
        if: ${{ !cancelled() }}
        uses: ./.github/composite-actions/turbo-cache-save

  build:
    name: build and docs e2e
    needs: changes
    if: >-
      github.event_name != 'schedule' &&
      github.event.pull_request.draft != true &&
      (needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs that test every engine hand the export to docs-e2e; others test
    # Chromium here, which saves a runner.
    env:
      ALL_ENGINES: ${{ contains(needs.changes.outputs.browsers, 'webkit') }}
    outputs:
      docs-export: ${{ steps.export.outputs.uploaded }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # On a push main is HEAD, so a depth-1 fetch would make HEAD shallow and
      # drop the HEAD^1 that TURBO_SCM_BASE compares with.
      - name: Fetch base branch
        if: github.event_name != 'push'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Setup
        uses: ./.github/composite-actions/setup

      # Every package, since the size check reads every dist. Unaffected ones
      # replay from the cache.
      - name: Build packages
        run: pnpm build

      # A no-change rerun must replay every task. A miss means a build writes
      # to its own inputs, and every later run would rebuild it.
      - name: Check builds replay from the cache
        run: node scripts/check-turbo-cache.mjs

      # attw, check:dts, the Node ESM check, and the tarball guard, which build no
      # longer runs. The filter keeps docs out: its build has no base path here,
      # so it would overwrite the export the e2e tests read.
      - name: Check packages
        run: pnpm turbo check:package --filter='./packages/*'

      # -r so widgets is covered too; it had been over budget unnoticed.
      - name: Check bundle size
        run: pnpm -r size:check

      # --affected skips the docs build when nothing it uses changed, and the
      # e2e tests read its static export, so they run only when it exists.
      - name: Build docs
        run: pnpm turbo build --affected
        env:
          NEXT_PUBLIC_BASE_PATH: /roadie
          TURBO_SCM_BASE: ${{ github.event_name == 'push' && 'HEAD^1' || 'origin/main' }}

      - name: Read Playwright version
        if: hashFiles('docs/out/index.html') != ''
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # The e2e tests also read tokens.json, which git ignores. Gzip, since
      # the Playwright image may lack zstd.
      - name: Pack docs export
        if: env.ALL_ENGINES == 'true' && hashFiles('docs/out/index.html') != ''
        run: tar -czf "$RUNNER_TEMP/docs-out.tar.gz" docs/out packages/core/src/tokens/tokens.json

      - name: Upload docs export
        if: env.ALL_ENGINES == 'true' && hashFiles('docs/out/index.html') != ''
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-out
          path: ${{ runner.temp }}/docs-out.tar.gz
          compression-level: 0
          retention-days: 3

      - name: Mark docs export uploaded
        if: steps.upload.outcome == 'success'
        id: export
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: env.ALL_ENGINES != 'true' && hashFiles('docs/out/index.html') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: env.ALL_ENGINES != 'true' && hashFiles('docs/out/index.html') != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Docs e2e tests
        if: env.ALL_ENGINES != 'true' && hashFiles('docs/out/index.html') != ''
        run: pnpm --filter docs test:e2e
        env:
          E2E_BROWSER: chromium
          NEXT_PUBLIC_BASE_PATH: /roadie

      - name: Save Turbo cache
        if: ${{ !cancelled() }}
        uses: ./.github/composite-actions/turbo-cache-save

  # Engines' locale data differs, so a hydration mismatch can show in one.
  # WebKit is left out: on Linux it times out the layout-driven tests. The
  # shard counts keep each runner near 100 s of tests.
  docs-e2e:
    name: docs e2e (${{ matrix.browser }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: build
    if: needs.build.outputs.docs-export == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1/2
          - browser: chromium
            shard: 2/2
          - browser: firefox
            shard: 1/3
          - browser: firefox
            shard: 2/3
          - browser: firefox
            shard: 3/3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/composite-actions/setup
        with:
          turbo-cache: 'false'

      - name: Download docs export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-out
          path: ${{ runner.temp }}

      - name: Unpack docs export
        run: tar -xzf "$RUNNER_TEMP/docs-out.tar.gz"

      - name: Docs e2e tests
        run: pnpm --filter docs test:e2e ${SHARD:+--shard=$SHARD}
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          NEXT_PUBLIC_BASE_PATH: /roadie
          SHARD: ${{ matrix.shard }}

  # The one check main requires. Skipped jobs pass, so docs-only PRs aren't
  # held; any failed or cancelled job fails it. Drafts skip it, since their
  # run has no build or browser jobs to vouch for.
  ci:
    name: CI result
    needs: [changes, check, playwright, browser, build, docs-e2e]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
