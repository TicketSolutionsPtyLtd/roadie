name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096
  TURBO_FORCE: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Setup
        uses: ./.github/composite-actions/setup

      - name: Lint, typecheck, and test
        run: pnpm turbo lint typecheck test --affected --framework-inference=false
        env:
          TURBO_SCM_BASE: origin/main

      # eslint's prettier rule only covers files it lints, so md/json drift
      # silently without this.
      - name: Check formatting
        run: pnpm format:check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One engine per runner: three at once backlog Vitest's Playwright bridge
    # and actions time out (vitest-dev/vitest#9941).
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Setup
        uses: ./.github/composite-actions/setup

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # The cache holds only the browser binaries; --with-deps still installs
      # the system libraries from apt, and skips a download already cached.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Browser tests
        run: pnpm turbo test:browser --affected --framework-inference=false
        env:
          ROADIE_BROWSERS: ${{ matrix.browser }}
          TURBO_SCM_BASE: origin/main

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Setup
        uses: ./.github/composite-actions/setup

      - name: Build packages
        run: pnpm turbo build --affected --framework-inference=false
        env:
          NEXT_PUBLIC_BASE_PATH: /roadie
          TURBO_SCM_BASE: origin/main

      # -r so widgets is covered too; it had been over budget unnoticed.
      - name: Check bundle size
        run: pnpm -r size:check
