name: Setup
description: Sets up Node.js and pnpm, restores the job's Turbo cache, and installs dependencies

inputs:
  turbo-cache:
    description: Restore this job's Turbo cache. Pair with the turbo-cache-save action at the end of the job.
    default: 'true'
  cache-scope:
    description: Names the job's cache. Defaults to the job id; matrix jobs add their entry so each saves its own.
    default: ''

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    # One key per job and commit, so jobs never race to save the same key.
    # A job with no cache of its own yet starts from CI's build job, whose
    # cache holds every package build. Restore keys match by prefix, so `@`
    # ends the scope: `build-` would also match docs.yml's `build-and-deploy`.
    - name: Name Turbo cache
      if: inputs.turbo-cache == 'true'
      shell: bash
      env:
        SCOPE: ${{ inputs.cache-scope || github.job }}
      run: |
        prefix="turbo-v2-$RUNNER_OS"
        {
          echo "TURBO_CACHE_KEY=$prefix-$SCOPE@$GITHUB_SHA"
          echo "TURBO_CACHE_RESTORE_SCOPE=$prefix-$SCOPE@"
          echo "TURBO_CACHE_RESTORE_FALLBACK=$prefix-build@"
          echo "TURBO_RUN_SUMMARY=true"
        } >> "$GITHUB_ENV"

    # The paths must match turbo-cache-save's, or the save makes a cache this
    # step can't restore.
    - name: Restore Turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .turbo/cache
          .turbo/cache-access.json
          docs/tsconfig.tsbuildinfo
        key: ${{ env.TURBO_CACHE_KEY }}
        restore-keys: |
          ${{ env.TURBO_CACHE_RESTORE_SCOPE }}
          ${{ env.TURBO_CACHE_RESTORE_FALLBACK }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
