version: 2

# Keeping direct deps current is what makes security overrides unnecessary —
# 15 of 20 died on their own once the parents caught up. Minor/patch are
# grouped so they stay reviewable; majors come separately and get read.
#
# `cooldown` matches pnpm's minimumReleaseAge (4320 minutes, 3 days) in
# pnpm-workspace.yaml, so Dependabot doesn't propose a version pnpm then
# refuses to install. Security updates skip the cooldown and the schedule:
# Dependabot security updates open them as soon as an advisory lands.
#
# Weekly, not daily: daily runs kept replacing the dev group before it merged,
# so #205, #209, #211, #290 and #323 each closed unmerged after a full CI run.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Brisbane
    cooldown:
      default-days: 3
      exclude:
        - '@oztix/*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Types track the .nvmrc runtime, so code can't reach for APIs a newer
    # major adds. Lift this with the .nvmrc bump to the next LTS.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # babel-plugin-react-compiler (1.0.0) targets Babel 7: under Babel 8 the
      # components tests hit "Maximum update depth exceeded" (#166). Lift this
      # once a compiler release supports Babel 8.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'
