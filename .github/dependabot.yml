version: 2

# Keeping direct deps current is what makes security overrides unnecessary —
# 15 of 20 died on their own once the parents caught up. Minor/patch are
# grouped so they stay reviewable; majors come separately and get read.
#
# Note: Dependabot does not honour pnpm's minimumReleaseAge cooldown, so a PR
# may propose a version `pnpm install` then refuses. Wait it out.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'
